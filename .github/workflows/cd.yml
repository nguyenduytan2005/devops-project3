# =============================================================================
# CD Pipeline - runs only when code is pushed/merged to main
# Purpose: build Docker images, push them to Docker Hub, then deploy
#
# ci.yml and cd.yml trigger independently. The branch protection rule (CI must
# pass before a PR can be merged) is what guarantees broken code never reaches
# main - and therefore never reaches this pipeline.
#
# Your tasks (see Lab 3 - publish images, and Lab 4 - deployment):
#   TODO 1  Log in to Docker Hub
#   TODO 2  Build and push the BACKEND image
#   TODO 3  Build and push the FRONTEND image
#   TODO 4  Deploy - choose ONE: Option A (SSH to a VPS) or Option B (Render)
#
# Repository settings (Settings > Secrets and variables > Actions):
#   Secrets   DOCKER_HUB_USERNAME        your Docker Hub username
#             DOCKER_HUB_TOKEN           Docker Hub access token (NOT your password)
#             SSH_HOST, SSH_USER, SSH_PRIVATE_KEY      Option A only
#             RENDER_DEPLOY_HOOK_BACKEND, RENDER_DEPLOY_HOOK_FRONTEND   Option B only
#   Variables BACKEND_URL                public URL of the backend, e.g.
#                                        http://<server-ip>:8080 or https://<name>.onrender.com
#                                        (a variable, not a secret: it is public and
#                                        is baked into the frontend bundle anyway)
# =============================================================================

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:      # lets you start this workflow by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Docker Hub login with an access token (never the account password)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Two tags per image: :latest is what Render pulls, :<sha> lets every
      # deployment be traced back to a commit and rolled back.
      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-backend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # REACT_APP_API_URL is baked into the JavaScript bundle at build time
      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          build-args: |
            REACT_APP_API_URL=${{ vars.BACKEND_URL }}
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-frontend:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/bug-tracker-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ===========================================================================
  # Deploy on Render (Option B). Option A (SSH to a VPS) is not used, so its
  # placeholder job was removed.
  # ===========================================================================
  # One-time setup in the Render dashboard (not in code):
  #   1. Create a PostgreSQL database; load database/database.sql into it.
  #   2. Create a Web Service for the backend from the Docker Hub image
  #      <user>/bug-tracker-backend:latest (port 8080) with the DB_* variables.
  #   3. Create a Web Service for the frontend from <user>/bug-tracker-frontend:latest
  #      (port 3000).
  #   4. Copy each service's Deploy Hook URL into the secrets
  #      RENDER_DEPLOY_HOOK_BACKEND / RENDER_DEPLOY_HOOK_FRONTEND.
  #
  # Render does not poll Docker Hub for new image tags; the deploy hook is how
  # CD tells Render to pull the new image.
  # ===========================================================================
  deploy-render:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 5

    steps:
      # A missing hook means the Render service is not set up yet: warn and
      # skip instead of failing, so the images above still count as published.
      - name: Trigger backend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_BACKEND is not set - skipping backend deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"

      - name: Trigger frontend deploy
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_FRONTEND is not set - skipping frontend deploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
