# Bug Tracker: React frontend + Express backend + PostgreSQL 15.
# Copy .env.example to .env first; every credential below is read from it.
#
#   docker compose up --build -d
#
# Start order is enforced with healthchecks: postgres healthy -> backend
# healthy -> frontend. Data lives in the postgres_data named volume, so it
# survives `docker compose down` (only `down -v` wipes it).

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the JS bundle at build time (the browser calls this URL)
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    image: ${DOCKER_HUB_USERNAME:-local}/bug-tracker-frontend:${IMAGE_TAG:-latest}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    image: ${DOCKER_HUB_USERNAME:-local}/bug-tracker-backend:${IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with node:24-alpine, so no extra package is needed
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only when the data volume is empty
      - ./database/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
